<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.35" stop-color="#ffb24d"/>
      <stop offset="0.65" stop-color="#ff7a1a"/>
      <stop offset="0.85" stop-color="#f0392b"/>
      <stop offset="1" stop-color="#b3001b"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.72" cy="0.28" r="0.9">
      <stop offset="0.5" stop-color="#0d0c0b" stop-opacity="0"/>
      <stop offset="1" stop-color="#781400" stop-opacity="0.35"/>
    </radialGradient>
    <style>
      .jp { font-family: "Noto Sans CJK JP","Noto Sans JP","Hiragino Sans",sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0d0c0b"/>
  <rect width="1200" height="630" fill="url(#vig)"/>

  <!-- 散らばるリスクドット（装飾） -->
  <g opacity="0.9">
    <circle cx="930" cy="150" r="46" fill="#b3001b" opacity="0.55"/>
    <circle cx="1010" cy="230" r="30" fill="#f0392b" opacity="0.6"/>
    <circle cx="880" cy="250" r="22" fill="#ff7a1a" opacity="0.6"/>
    <circle cx="1050" cy="140" r="16" fill="#ffb24d" opacity="0.65"/>
    <circle cx="965" cy="320" r="18" fill="#ff7a1a" opacity="0.5"/>
    <circle cx="900" cy="360" r="12" fill="#ffe08a" opacity="0.6"/>
    <circle cx="1080" cy="300" r="13" fill="#f0392b" opacity="0.5"/>
  </g>

  <!-- キッカー -->
  <rect x="80" y="120" width="40" height="4" fill="#ff7a1a"/>
  <text x="134" y="128" class="jp" font-size="24" font-weight="700" fill="#ffb24d" letter-spacing="3">秋田県 ツキノワグマ ｜ 統計予測</text>

  <!-- タイトル -->
  <text x="78" y="248" class="jp" font-size="96" font-weight="900" fill="#f4efe6">次週 <tspan fill="#ff7a1a">出没リスク</tspan></text>
  <text x="78" y="350" class="jp" font-size="96" font-weight="900" fill="#f4efe6">予測マップ</text>

  <!-- サブ -->
  <text x="80" y="430" class="jp" font-size="30" font-weight="500" fill="#c2bbae">出没オープンデータを機械学習で予測 ・ 1km メッシュ × 週次</text>

  <!-- リスクスケール -->
  <rect x="80" y="486" width="640" height="16" rx="8" fill="url(#risk)"/>
  <text x="80" y="536" class="jp" font-size="22" font-weight="500" fill="#948b7d">リスク 低</text>
  <text x="720" y="536" class="jp" font-size="22" font-weight="500" fill="#948b7d" text-anchor="end">高</text>

  <!-- 出典 -->
  <text x="80" y="588" class="jp" font-size="20" fill="#7d766a">出典: 秋田県クマダス（CC BY 4.0）・地図 © OpenStreetMap © CARTO ・ 個人プロジェクト</text>
</svg>
