      width: min(394px, 92vw); padding: 18px 24px 28px; overflow-y: auto;

    .panel::-webkit-scrollbar { width: 0; }
    :focus-visible { outline: 2px solid var(--c2); outline-offset: 2px; border-radius: 4px; }
    .metric { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 4px; }
    .metric .big { font-family: var(--display); font-weight: 800; font-size: 46px;

    .metric .unit { font-size: 13px; color: var(--ink-dim); }

    .sec { margin-top: 22px; }

    /* 横棒ランキング */
    .bar { margin-bottom: 9px; padding: 3px 6px; margin-left: -6px; margin-right: -6px;

    .bar .row { display: flex; align-items: baseline; justify-content: space-between;
      font-size: 13px; margin-bottom: 3px; }
    .bar .row .rank { color: var(--ink-faint); font-family: var(--display); width: 22px; display: inline-block; }
    .bar .row .name { color: var(--ink); font-weight: 500; flex: 1; }
    .bar .row .val { font-family: var(--display); font-weight: 700; color: var(--ink-dim); }
    .bar .track { height: 7px; border-radius: 4px; background: rgba(255,255,255,.06); overflow: hidden; }
    .bar .fill { height: 100%; width: 0; border-radius: 4px;
      background: linear-gradient(90deg, var(--c2), var(--c4));
      transition: width 1.1s cubic-bezier(.16,1,.3,1); }
    .bar.top1 .fill { background: linear-gradient(90deg, var(--c3), var(--c5)); box-shadow: 0 0 14px rgba(240,57,43,.55); }
    .bar.top1 .name { color: #fff; }

    /* 時間帯チャート */
    .hours { display: flex; align-items: flex-end; gap: 6px; height: 96px; margin-top: 4px; }
    .hours .h { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%;

    .hours .hb { width: 100%; border-radius: 4px 4px 0 0; background: rgba(255,178,77,.35);

    .hours .h.peak .hb { background: linear-gradient(180deg, var(--c3), var(--c5)); box-shadow: 0 0 12px rgba(255,122,26,.5); }
    .hours .hl { font-size: 9.5px; color: var(--ink-faint); text-align: center; line-height: 1.2; white-space: nowrap; }

    .note { font-size: 11.5px; color: var(--ink-faint); line-height: 1.6; margin-top: 12px; }

    /* 地域トレンド */
    .area-sel { width: 100%; background: #1a1714; color: var(--ink); border: 1px solid var(--hair);

      background-image: linear-gradient(45deg, transparent 50%, var(--c2) 50%), linear-gradient(135deg, var(--c2) 50%, transparent 50%);
      background-position: calc(100% - 18px) 17px, calc(100% - 13px) 17px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
    .spark { width: 100%; height: 56px; display: block; }
    .spark-cap { font-size: 10.5px; color: var(--ink-faint); display: flex; justify-content: space-between; margin-top: 2px; }
    .trend-head { display: flex; align-items: baseline; gap: 9px; margin-top: 10px; }
    .trend-head .fc { font-family: var(--display); font-weight: 800; font-size: 30px; color: var(--ink); }
    .trend-head .fcu { font-size: 11px; color: var(--ink-dim); }

    .badge { font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px;

    .badge.up { background: rgba(240,57,43,.18); color: #ff8472; }
    .badge.down { background: rgba(91,140,184,.2); color: #93bdec; }
    .badge.flat { background: rgba(255,255,255,.08); color: var(--ink-dim); }
    .badge small { color: var(--ink-faint); font-weight: 500; }

    /* 凡例（カラースケール） */
    .legend { position: absolute; left: 26px; bottom: 22px; z-index: 1000;
      background: var(--panel); border: 1px solid var(--hair); border-radius: 10px;

    .legend .lt { font-size: 11px; color: var(--ink-dim); font-weight: 700; letter-spacing: .04em; margin-bottom: 8px; }
    .legend .scale { height: 10px; border-radius: 5px;
      background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c5)); }
    .legend .ends { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-faint); margin-top: 5px; }
    .legend .src { font-size: 10px; color: var(--ink-faint); margin-top: 9px; line-height: 1.5; }

    /* 出没実績の凡例ドット */
    .dotrow { display: flex; gap: 16px; margin-top: 4px; }
    .dotrow span { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-dim); }
    .dot { width: 11px; height: 11px; border-radius: 50%; }

    .hidden { display: none !important; }

    /* Leaflet ポップアップを暗色に */
    .leaflet-popup-content-wrapper { background: #181513; color: var(--ink); border-radius: 10px;

    .leaflet-popup-tip { background: #181513; }

    .leaflet-control-attribution a { color: #b9b1a3 !important; }

    /* 焦点（#1）パルス */
    .hotspot { position: relative; }
    .hotspot::before, .hotspot::after { content: ""; position: absolute; left: 50%; top: 50%;
      width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;

    .hotspot::after { box-shadow: 0 0 0 0 rgba(240,57,43,.7); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(240,57,43,.6); }

    /* 起動アニメーション */
    .reveal { opacity: 0; transform: translateY(12px); animation: rise .9s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes rise { to { opacity: 1; transform: none; } }

    /* リンク（色だけに頼らず下線も付ける） */
    .panel a, .legend a { color: var(--c2); text-decoration: underline; text-underline-offset: 2px; }

    /* スクリーンリーダー専用（視覚的に隠す） */
    .vh { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    /* モーション抑制（前庭障害・酔い対策 / WCAG 2.3.3） */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important; animation-iteration-count: 1 !important;
        transition-duration: .001ms !important; scroll-behavior: auto !important;
      }
      .reveal { opacity: 1; transform: none; }
      .hotspot::after { animation: none !important; }
      .bar .fill, .hours .hb { transition: none !important; }
    }

    /* ---- モバイル: パネルを下シートに ---- */
    @media (max-width: 720px) {
      .head { max-width: 92vw; padding: 15px 18px; }
      .title { font-size: clamp(26px, 8vw, 38px); }
      .toggle { top: auto; bottom: calc(58vh + 14px); left: 50%; right: auto; transform: translateX(-50%); }
      .panel { top: auto; bottom: 0; left: 0; right: 0; width: 100%; height: 58vh; min-height: 320px;

  <!-- points.js (2.4MB) は実績モードに切替えた時だけ遅延ロード -->
  <script src="predictions.js"></script>
  <script>
    // ===== 地図 =====
    const map = L.map("map", { preferCanvas: true, zoomControl: false })
      .setView([39.62, 140.45], 9);
    L.control.zoom({ position: "bottomright" }).addTo(map);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 19, subdomains: "abcd",
      attribution: '出典: 秋田県クマダス（CC BY 4.0）｜© OpenStreetMap © CARTO',
    }).addTo(map);

    // ===== XSS 対策: データ由来文字列は全てエスケープしてから挿入 =====
    const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, m => ESC[m]); }

    // ===== 逐次配色 YlOrRd =====
    const STOPS = ["#ffe08a", "#ffb24d", "#ff7a1a", "#f0392b", "#b3001b"];
    function hex2rgb(h){ return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); }
    const STOPRGB = STOPS.map(hex2rgb);
    function colorFor(t){ // t in [0,1]
      t = Math.max(0, Math.min(1, t));
      const x = t * (STOPRGB.length - 1), i = Math.floor(x), f = x - i;
      const a = STOPRGB[i], b = STOPRGB[Math.min(i+1, STOPRGB.length-1)];
      const c = a.map((v,k)=> Math.round(v + (b[k]-v)*f));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }

    // ===== レイヤ: 出没実績（M1）— points.js(2.4MB) は遅延ロード =====
    const actualLayer = L.layerGroup();
    let actualState = "idle"; // idle → loading → ready / error
    function buildActualLayer() {
      KUMA_POINTS.forEach(p => {
        const col = p.citizen ? "#5b8cb8" : "#ff8c3a";
        L.circleMarker([p.lat, p.lon], { radius: 3.4, color: col, weight: 0,
          fillColor: col, fillOpacity: .55 })
          .bindPopup(`<b>${esc(p.city || "不明")}</b><br>${esc(p.dt)}　${esc(p.kind || "")}` +
            (p.citizen ? "<br><i>市民投稿</i>" : ""))
          .addTo(actualLayer);
      });
      actualState = "ready";
    }
    function ensureActual(done) {
      if (actualState === "ready") { done(); return; }
      if (actualState === "loading") return;
      actualState = "loading";
      const s = document.createElement("script");
      s.src = "points.js";
      s.onload = () => { buildActualLayer(); done(); };
      s.onerror = () => { actualState = "error";
        panel.innerHTML = '<p class="note">出没データ (points.js) を読み込めませんでした。</p>'; };
      document.head.appendChild(s);
    }

    // ===== レイヤ: 次週リスク（M3） =====
    const riskLayer = L.layerGroup();
    const svgR = L.svg();
    let hasPred = typeof KUMA_PRED !== "undefined" && KUMA_PRED.mesh_risk;
    if (hasPred) {
      const probs = KUMA_PRED.mesh_risk.map(d => d.prob);
      const pmin = Math.min(...probs), pmax = Math.max(...probs);
      const norm = v => (v - pmin) / Math.max(1e-9, pmax - pmin);
      KUMA_PRED.mesh_risk.forEach(d => {
        const t = norm(d.prob);
        const col = colorFor(t);
        L.circleMarker([d.lat, d.lon], { renderer: svgR,
          radius: 3.5 + t * 11, color: col, weight: 1, opacity: .35 + t * .45,
          fillColor: col, fillOpacity: .22 + t * .5 })
          .bindPopup(`<b>出没確率 ${(d.prob*100).toFixed(0)}%</b><br>${d.lat.toFixed(3)}, ${d.lon.toFixed(3)}`)
          .addTo(riskLayer);
      });
      // #1 ホットスポットにパルスマーカー（アンカーを中心に）
      const h = KUMA_PRED.mesh_top[0];
      if (h) {
        L.marker([h.lat, h.lon], { zIndexOffset: 1000,
          icon: L.divIcon({ className: "hotspot", iconSize: [14, 14], iconAnchor: [7, 7] }) })
          .bindPopup(`<b>最高リスク ${(h.prob*100).toFixed(0)}%</b><br>${esc(h.city)}・${esc(h.band)}`)
          .addTo(riskLayer);
      }
    }

    // ===== パネル描画 =====
    const panel = document.getElementById("panel");
    const legend = document.getElementById("legend");
    const subtitle = document.getElementById("subtitle");
    const titleEl = document.getElementById("title");

    function renderRisk() {
      titleEl.innerHTML = '次週<em>出没リスク</em>マップ';
      const tw = hasPred ? KUMA_PRED.target_week : "—";
      subtitle.textContent = hasPred
        ? `過去の出没履歴から学習した勾配ブースティング木で、各 1km メッシュの「翌週に出没する確率」を予測。対象週: ${tw}〜。`
        : "予測データが未生成です。`python -m src.train` を実行してください。";
      if (!hasPred) { panel.innerHTML = '<p class="note">予測データ (predictions.js) がありません。<br><b>python -m src.train</b> を実行してください。</p>'; legend.classList.add("hidden"); return; }
      legend.classList.remove("hidden");

      const cities = KUMA_PRED.city_top.slice(0, 10);
      const maxExp = Math.max(...cities.map(c => c.expected));
      let bars = cities.map((c, i) => `
        <div class="bar ${i===0?'top1':''}">
          <div class="row"><span class="rank">${i+1}</span>
            <span class="name">${esc(c.city)}</span>
            <span class="val">${c.expected.toFixed(0)}</span></div>
          <div class="track"><div class="fill" data-w="${(c.expected/maxExp*100).toFixed(1)}"></div></div>
        </div>`).join("");

      const hrs = KUMA_PRED.time_dist;
      const maxH = Math.max(...hrs.map(h => h.n));
      const peak = hrs.reduce((a,b)=> b.n>a.n?b:a, hrs[0]);
      let hours = hrs.map(h => `
        <div class="h ${h.band===peak.band?'peak':''}">
          <div class="hb" data-h="${(h.n/maxH*100).toFixed(1)}"></div>
          <div class="hl">${h.band.replace(/\(.*\)/, "")}</div>
        </div>`).join("");

      const top1 = KUMA_PRED.mesh_top[0];
      const trends = KUMA_PRED.trends || {};
      const areaNames = Object.keys(trends).sort((a, b) => trends[b].forecast - trends[a].forecast);
      const opts = areaNames.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
      const trendSec = areaNames.length ? `
        <div class="sec">
          <h2>自分の地域のリスク推移 <span>市町村 × 直近26週</span></h2>
          <label class="vh" for="area-sel">リスク推移を見る市町村を選択</label>
          <select class="area-sel" id="area-sel" aria-label="リスク推移を見る市町村">${opts}</select>
          <div id="trend-body"></div>
        </div>` : "";

      panel.innerHTML = `
        <div class="metric-label">最高リスク地点</div>
        <div class="metric"><span class="big">${(top1.prob*100).toFixed(0)}<span style="font-size:24px">%</span></span>
          <span class="unit">${esc(top1.city)}　${esc(top1.band)}</span></div>
        ${trendSec}
        <div class="sec">
          <h2>出没リスク 地区ランキング <span>翌週の見込み</span></h2>
          ${bars}
          <p class="note">数値 = <b>翌週クマが出そうな 1km 区画の見込み数</b>（確率の合計）。地区が広いほど大きくなりやすい。</p>
        </div>
        <div class="sec">
          <h2>出没しやすい時間帯 <span>過去の全出没</span></h2>
          <div class="hours" role="img" aria-label="過去の出没の時間帯分布。最も多いのは${esc(peak.band)}。">${hours}</div>
          <p class="note"><b>注</b>: 時間帯は通報・目撃のしやすさ（人の活動時間）の影響を含む。早朝・夕方の実リスクは過小評価の可能性。</p>
        </div>`;

      legend.innerHTML = `
        <div class="lt">翌週 出没確率</div>
        <div class="scale"></div>
        <div class="ends"><span>低</span><span>高</span></div>
        <div class="src">予測: 勾配ブースティング木（時系列分割 ROC-AUC 0.88）<br>2022 年以降の履歴で学習・1km メッシュ × 週次<br>
          <b style="color:var(--ink-dim)">※ 統計的推定であり実際の出没を保証しません。安全判断は自治体・<a href="https://www.pref.akita.lg.jp/" target="_blank" rel="noopener noreferrer">秋田県</a>等の公式情報を優先してください。</b></div>`;
      requestAnimationFrame(animateBars);

      // 地域トレンドの初期描画 + セレクタ連動
      const sel = document.getElementById("area-sel");
      if (sel) {
        // ランキング 1 位の地区が属する市町村を初期選択
        const top1city = areaNames.find(c => (KUMA_PRED.mesh_top[0].city || "").startsWith(c)) || areaNames[0];
        sel.value = top1city;
        const draw = () => { document.getElementById("trend-body").innerHTML = renderTrend(sel.value); };
        sel.onchange = draw;
        draw();
      }
    }

    // ===== トレンド描画ヘルパ =====
    function sparkline(series, label) {
      const W = 320, H = 56, pad = 4, n = series.length;
      const ys = series.map(d => d.risk), maxY = Math.max(...ys, 1e-6);
      const px = i => pad + i * (W - 2 * pad) / Math.max(1, n - 1);
      const py = v => H - pad - (v / maxY) * (H - 2 * pad);
      const pts = series.map((d, i) => `${px(i).toFixed(1)},${py(d.risk).toFixed(1)}`).join(" ");
      const area = `${px(0).toFixed(1)},${H-pad} ${pts} ${px(n-1).toFixed(1)},${H-pad}`;
      return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">
        <defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#ffb24d"/><stop offset="1" stop-color="#f0392b"/></linearGradient></defs>
        <polygon points="${area}" fill="rgba(255,122,26,.14)"/>
        <polyline points="${pts}" fill="none" stroke="url(#sg)" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="${px(n-1).toFixed(1)}" cy="${py(ys[n-1]).toFixed(1)}" r="3.2" fill="#f0392b"/>
      </svg>`;
    }
    function badge(label, pct) {
      if (pct === null || pct === undefined)
        return `<span class="badge flat"><span aria-hidden="true">→</span> <small>${label}: データ不足</small></span>`;
      const cls = pct > 3 ? "up" : pct < -3 ? "down" : "flat";
      const arrow = pct > 3 ? "▲" : pct < -3 ? "▼" : "→";
      const dir = pct > 3 ? "増加" : pct < -3 ? "減少" : "横ばい";
      return `<span class="badge ${cls}"><span aria-hidden="true">${arrow}</span> ${pct > 0 ? "+" : ""}${pct}% `
        + `<small>${label}（${dir}）</small></span>`;
    }
    function renderTrend(city) {
      const t = (KUMA_PRED.trends || {})[city];
      if (!t) return "";
      const fmt = p => (p === null || p === undefined) ? "データ不足"
        : (p > 0 ? "+" : "") + p + "%";
      const sparkLabel = `${city} のリスク推移（直近26週）。次週予測 ${t.forecast.toFixed(1)}、`
        + `前週比 ${fmt(t.wow_pct)}、前年同期比 ${fmt(t.yoy_pct)}。`;
      return `${sparkline(t.series, sparkLabel)}
        <div class="spark-cap" aria-hidden="true"><span>${esc(t.series[0].w)}</span><span>← 26週 →</span><span>次週</span></div>
        <div class="trend-head"><span class="fc">${t.forecast.toFixed(1)}</span>
          <span class="fcu">翌週 出そうな区画の<br>見込み数（リスク指数）</span></div>
        <div class="badges">${badge("前週比", t.wow_pct)}${badge("前年同期比", t.yoy_pct)}</div>`;
    }

    function renderActual() {
      titleEl.innerHTML = '<em>出没実績</em>マップ';
      const m = (typeof KUMA_META !== "undefined") ? KUMA_META : {};
      subtitle.textContent = `秋田県クマダスに記録された全出没（ツキノワグマ）。${m.from || ""}〜${m.to || ""}。`;
      panel.innerHTML = `
        <div class="metric-label">記録された出没</div>
        <div class="metric"><span class="big">${(m.count||0).toLocaleString()}</span><span class="unit">件</span></div>
        <div class="sec">
          <h2>凡例</h2>
          <div class="dotrow">
            <span><i class="dot" style="background:#ff8c3a"></i>公式記録</span>
            <span><i class="dot" style="background:#5b8cb8"></i>市民投稿</span>
          </div>
          <p class="note"><b>市民投稿（【投稿】）</b>は真偽不明の注記があるものを含む。除外せず信頼度の参考として表示。</p>
        </div>
        <div class="sec">
          <h2>データについて</h2>
          <p class="note">2021 年以前は記録が極端に少ないが、これは出没の不在ではなく<b>オープンデータ収録の開始時期</b>による。予測モデルは 2022 年以降に限定。</p>
        </div>`;
      legend.classList.add("hidden");
    }

    function animateBars() {
      document.querySelectorAll(".fill").forEach(el => { el.style.width = el.dataset.w + "%"; });
      document.querySelectorAll(".hb").forEach(el => { el.style.height = el.dataset.h + "%"; });
    }

    // ===== モード切替 =====
    const btnRisk = document.getElementById("btn-risk");
    const btnActual = document.getElementById("btn-actual");
    const statusEl = document.getElementById("status");
    function announce(msg) { if (statusEl) statusEl.textContent = msg; }

    function setMode(mode) {
      const risk = mode === "risk";
      btnRisk.classList.toggle("on", risk);
      btnActual.classList.toggle("on", !risk);
      btnRisk.setAttribute("aria-pressed", String(risk));
      btnActual.setAttribute("aria-pressed", String(!risk));
      if (risk) {
        map.removeLayer(actualLayer); riskLayer.addTo(map); renderRisk();
        announce("次週リスク表示に切り替えました");
      } else {
        map.removeLayer(riskLayer);
        if (actualState !== "ready") {
          panel.innerHTML = '<p class="note">出没実績データを読み込み中…（初回のみ）</p>';
          legend.classList.add("hidden");
          announce("出没実績データを読み込み中");
        }
        ensureActual(() => { actualLayer.addTo(map); renderActual();
          announce("出没実績表示に切り替えました"); });
      }
    }
    btnRisk.onclick = () => setMode("risk");
    btnActual.onclick = () => setMode("actual");

    // 初期表示: 予測があればリスク、なければ実績
    setMode(hasPred ? "risk" : "actual");
    if (!hasPred) { btnRisk.style.opacity = .4; btnRisk.style.pointerEvents = "none"; }
  </script>
</body>
</html>
