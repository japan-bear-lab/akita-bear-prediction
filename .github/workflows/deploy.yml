name: Build & Deploy to Pages

on:
  push:
    branches: [main]
  schedule:
    # 毎月 1 日 20:00 UTC = JST 翌 5:00（クマダスは毎月更新）
    - cron: "0 20 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # アクションは commit SHA でピン留め（タグ書換型のサプライチェーン攻撃対策）
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build data & model
        run: |
          python -m src.build_db      # CKAN 取得 → SQLite → web/points.js
          python -m src.build_panel   # メッシュ×週パネル
          python -m src.train         # 学習・予測 → web/predictions.js

      - name: Render OGP image (SVG → PNG, CJK フォント込み)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-noto-cjk
          rsvg-convert -w 1200 -h 630 web/ogp.svg -o web/ogp.png

      - name: Disable Jekyll
        run: touch web/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
